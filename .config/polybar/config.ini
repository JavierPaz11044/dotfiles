; Catppuccin Mocha — eww-style pills + Pac-Man workspaces
; Polybar 3.7: paddings MUST use px (bare numbers = spaces and clip content)
[colors]
background = #EB1E1E2E
background-alt = #313244
foreground = #CDD6F4
primary = #89B4FA
secondary = #94E2D5
alert = #F38BA8
disabled = #585B70
green = #A6E3A1
yellow = #F9E2AF
mauve = #CBA6F7
transparent = #00000000

[settings]
screenchange-reload = true

[global/wm]
margin-top = 0
margin-bottom = 0

[bar/pill]
monitor = ${env:MONITOR:}
height = 34
offset-y = 8
radius = 10
background = ${colors.background}
foreground = ${colors.foreground}
border-size = 1
border-color = #5989B4FA
padding-left = 10px
padding-right = 10px
module-margin = 8px
separator =
font-0 = JetBrainsMono Nerd Font:size=12;3
font-1 = Font Awesome 7 Free:style=Solid:size=11;3
font-2 = Font Awesome 7 Free:size=11;3
font-3 = Noto Color Emoji:scale=10;3
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = bspwm
override-redirect = false
dpi = 96

[bar/shell]
inherit = bar/pill
width = 52
offset-x = 12
padding-left = 14px
padding-right = 14px
modules-center = shell

[bar/wspills]
inherit = bar/pill
; Tight width so icons fill the pill end-to-end
width = 280
offset-x = 76
padding-left = 6px
padding-right = 6px
module-margin = 0
modules-center = bspwm
font-0 = JetBrainsMono Nerd Font:size=10;4
font-1 = Font Awesome 7 Free:style=Solid:size=10;4
font-2 = Font Awesome 7 Free:size=10;4

[bar/system]
inherit = bar/pill
width = 340
offset-x = 50%:-170
; Smaller type for percentages in the center pill
font-0 = JetBrainsMono Nerd Font:size=10;4
font-1 = Font Awesome 7 Free:style=Solid:size=10;4
font-2 = Font Awesome 7 Free:size=10;4
module-margin = 6px
modules-center = pulseaudio battery memory filesystem

; Local IPv4 address (left of the right tray pill)
[bar/ip]
inherit = bar/pill
width = 155
offset-x = 100%:-410
font-0 = JetBrainsMono Nerd Font:size=10;4
font-1 = Font Awesome 7 Free:style=Solid:size=10;4
font-2 = Font Awesome 7 Free:size=10;4
modules-center = ip

[bar/right]
inherit = bar/pill
; Hug content so icons fill the pill (no empty side)
width = 230
offset-x = 100%:-242
font-0 = JetBrainsMono Nerd Font:size=10;4
font-1 = Font Awesome 7 Free:style=Solid:size=10;4
font-2 = Font Awesome 7 Free:size=10;4
module-margin = 6px
modules-center = bluetooth systray date power

[bar/right-notray]
inherit = bar/right
modules-center = bluetooth date power

[module/shell]
type = custom/text
format = <label>
label = 󰀻
label-foreground = ${colors.mauve}
label-padding = 2px
click-left = ~/.local/bin/launcher

[module/ip]
type = custom/script
exec = ~/.config/polybar/scripts/ip.sh
interval = 30
format = <label>
format-prefix = "󰩟 "
format-prefix-foreground = ${colors.secondary}
label = %output%

[module/bluetooth]
type = custom/text
format = <label>
label = 󰂯
label-foreground = ${colors.primary}
label-padding = 2px
click-left = systemsettings kcm_bluetooth
click-right = bluetoothctl power on

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
inline-mode = true
enable-click = true
enable-scroll = true
reverse-scroll = false
fuzzy-match = false
format = <label-state>
format-font = 0

; Even spacing between the 10 workspace icons
label-focused = 󰮯
label-focused-foreground = ${colors.yellow}
label-focused-padding = 1

label-occupied = 󰊠
label-occupied-foreground = ${colors.green}
label-occupied-padding = 1

label-urgent = 󰮯
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

label-empty = 󰊠
label-empty-foreground = #A6ADC8
label-empty-padding = 1

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.yellow}
format-font = 0
label = %percentage_used%%
label-font = 0

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${colors.secondary}
format-mounted-font = 0
label-mounted = %percentage_used%%
label-unmounted = %mountpoint%
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
format-volume-font = 0
label-volume = %percentage%%
label-muted = 󰖁
label-muted-foreground = ${colors.disabled}
click-right = pavucontrol &

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 5
format-charging-prefix = "󰂄 "
format-charging-prefix-foreground = ${colors.yellow}
format-discharging-prefix = "󰁾 "
format-discharging-prefix-foreground = ${colors.green}
format-full-prefix = "󰁹 "
format-full-prefix-foreground = ${colors.green}
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

[module/systray]
type = internal/tray
format-margin = 4px
tray-spacing = 6px
tray-size = 60%

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.foreground}
format-prefix = "󰥔 "
format-prefix-foreground = ${colors.primary}

[module/power]
type = custom/text
format = <label>
label = 󰐥
label-foreground = ${colors.alert}
label-padding = 2px
click-left = ~/.config/polybar/scripts/powermenu.sh
